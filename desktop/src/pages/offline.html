<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NotesApp</title>
    <link rel="stylesheet" href="pages.css" />
    <script src="offline.js" defer></script>
  </head>
  <body>
    <main class="center">
      <div class="brand brand-center">
        <img src="icon.png" alt="" />
      </div>
      <h1>Can't reach the server. Is Tailscale connected?</h1>
      <p class="muted" id="server"></p>
      <p class="muted" id="reason"></p>
      <p class="muted">NotesApp retries every few seconds and opens as soon as the server answers.</p>
      <div class="actions">
        <button type="button" class="primary" id="retry">Retry</button>
        <button type="button" id="settings">Change server…</button>
      </div>
    </main>
  </body>
</html>
