# NotesApp on homeserver: tailscale + notes + watchtower, plus the optional backup sidecars. Runbook: docs/DEPLOY.md
# Run every docker compose command from this directory (deploy/), next to .env.
name: notes

x-logging: &logging                             # size-capped logs; the daemon default (json-file) never rotates
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  tailscale:
    image: tailscale/tailscale:stable
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}               # one-off auth key tagged tag:notes; delete it from .env after the first login
      TS_EXTRA_ARGS: --advertise-tags=tag:notes
      TS_HOSTNAME: notes                        # → https://notes.<tailnet>.ts.net
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTH_ONCE: "true"                      # don't re-login on every start
      TS_USERSPACE: "false"                     # kernel mode: REQUIRED (userspace forwards every tailnet port to 127.0.0.1)
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002        # /healthz, loopback only
    volumes:
      - tailscale-state:/var/lib/tailscale      # node identity + TLS certs: never delete
      - ./tailscale:/config:ro                  # a DIRECTORY (serve.json is watched with fsnotify)
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    restart: unless-stopped
    # deliberately NO watchtower label: update by hand, monthly (docs/DEPLOY.md)

  notes:
    image: ghcr.io/rjgehan/notesapp:latest      # a rollback pins sha-<…> in docker-compose.override.yml (docs/DEPLOY.md)
    network_mode: service:tailscale             # shares tailscale's netns; no ports/hostname/networks allowed
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true
    environment:
      TZ: ${TZ:-UTC}
      NOTES_ALLOWED_HOSTS: ${NOTES_ALLOWED_HOSTS:?set NOTES_ALLOWED_HOSTS in deploy/.env}
      NOTES_IDENTITY_ALLOWED_LOGINS: ${NOTES_IDENTITY_ALLOWED_LOGINS:?set NOTES_IDENTITY_ALLOWED_LOGINS in deploy/.env}
      NOTES_TAILSCALE_WATCHDOG_ENABLED: "true"  # exit (→ restart) if orphaned from tailscale's netns
      NOTES_GIT_LARGE_FILE_THRESHOLD: ${NOTES_GIT_LARGE_FILE_THRESHOLD:-25MB}   # larger files stay out of git history (0 = version everything)
      # ---- Mirror of the vault's history to a private GitHub repository (ROADMAP item 2, DEPLOY.md "Mirror"):
      NOTES_MIRROR_URL: ${NOTES_MIRROR_URL:-}   # https://github.com/<you>/<repo>.git; empty = no mirror
      NOTES_MIRROR_TOKEN_FILE: /run/secrets/mirror_token
      # App-error alerts (ROADMAP item 38) are on when /data/secrets/ntfy.json exists (DEPLOY.md "App alerts").
      # Reminders (ROADMAP item 9) are switched on in Settings › Reminders (DEPLOY.md "Reminders"). Empty = the
      # VAPID contact is https://<first allowed host>; set mailto:you@example.com if a push service refuses it.
      NOTES_REMINDERS_VAPID_SUBJECT: ${NOTES_REMINDERS_VAPID_SUBJECT:-}
      # ---- Voice-note transcription (ROADMAP item 33, DEPLOY.md "Voice notes"): off while empty. With the
      # whisper service below (COMPOSE_PROFILES=transcription): http://whisper:9000
      NOTES_TRANSCRIPTION_URL: ${NOTES_TRANSCRIPTION_URL:-}
      NOTES_TRANSCRIPTION_API: ${NOTES_TRANSCRIPTION_API:-whisper-asr}       # or openai (whisper.cpp server, speaches, OpenAI)
      NOTES_TRANSCRIPTION_LANGUAGE: ${NOTES_TRANSCRIPTION_LANGUAGE:-}        # e.g. en; empty = detected per recording
      NOTES_TRANSCRIPTION_MODEL: ${NOTES_TRANSCRIPTION_MODEL:-whisper-1}     # openai only: the server's model name
      NOTES_TRANSCRIPTION_API_KEY_FILE: ${NOTES_TRANSCRIPTION_API_KEY_FILE:-} # openai only, e.g. /data/secrets/transcription-key
      NOTES_TRANSCRIPTION_TIMEOUT: ${NOTES_TRANSCRIPTION_TIMEOUT:-10m}       # per recording
      NOTES_TRANSCRIPTION_MAX_SIZE: ${NOTES_TRANSCRIPTION_MAX_SIZE:-25MB}    # larger recordings are not sent
      # ---- Ask your vault (ROADMAP item 18, DEPLOY.md "Ask your vault"): off until switched on in Settings.
      NOTES_AI_API_KEY_FILE: /run/secrets/anthropic_key
      # ---- Public publishing (ROADMAP item 26, DEPLOY.md "Public publishing"): OFF. The read-only publish server
      # (127.0.0.1:8081, published snapshots only) starts only with NOTES_PUBLISH_ENABLED=true, and is public only
      # once tailscale/serve.json also has the Funnel entry (serve.funnel.json.example). Snapshots: /data/publish.
      NOTES_PUBLISH_ENABLED: ${NOTES_PUBLISH_ENABLED:-false}
      NOTES_PUBLISH_BASE_URL: ${NOTES_PUBLISH_BASE_URL:-}     # https://notes.<tailnet>.ts.net:8443, for copied links
    secrets: [mirror_token, anthropic_key]
    volumes:
      - notes-data:/data
      # The last backup run's status.json, read-only, for the status page (ROADMAP item 38). Host cron writes it
      # elsewhere: set NOTES_BACKUP_STATE to that directory, and create it first, as your user: Docker would create
      # a missing one as root, which the cron job cannot write (DEPLOY.md "Host cron instead of backup-scheduler").
      - ${NOTES_BACKUP_STATE:-backup-state}:/backup-state:ro
    mem_limit: 1g
    stop_grace_period: 45s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging: *logging
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:1.23.1@sha256:3175c006eb20112f3a70f7002f82dbf4a4078c97e7033735a4d153668fc3dfb1   # maintained fork; pinned by digest (it holds docker.sock)
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"           # only touches the 'notes' container
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_TIMEOUT: 45s                   # matches notes.stop_grace_period
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: homeserver
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}   # optional; empty = no notifications (ntfy recommended)
      WATCHTOWER_NOTIFICATION_REPORT: "true"    # report every update session (updated, failed, skipped)
      DOCKER_CONFIG: /config                    # GHCR credentials (package is private)
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/watchtower:/config:ro              # DIRECTORY containing config.json from `docker --config /etc/watchtower login ghcr.io`
    logging: *logging
    restart: unless-stopped

  # ---- Voice-note transcription (ROADMAP item 33, DEPLOY.md "Voice notes"): off until deploy/.env adds
  # transcription to COMPOSE_PROFILES and sets NOTES_TRANSCRIPTION_URL=http://whisper:9000. whisper-asr-webservice
  # (MIT) with faster-whisper on the CPU; the model is downloaded into whisper-models on first start. Reachable only
  # from the app's network (no ports), and it stores no audio. No watchtower label: Dependabot proposes bumps.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0@sha256:0616c3d5fc6924e9d59aa8a7a3a944fbe8f3a5d701e5fc1fa2ce5b933dfecb73
    profiles: [transcription]
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${NOTES_WHISPER_MODEL:-small}   # base: faster on a slow CPU; medium: better, slower, more memory
      ASR_MODEL_PATH: /data/whisper
      MODEL_IDLE_TIMEOUT: "900"                 # frees the model's memory after 15 idle minutes
    volumes:
      - whisper-models:/data/whisper
    mem_limit: 3g
    logging: *logging
    restart: unless-stopped

  # ---- Nightly backups (ROADMAP item 1, DESIGN §7.10, DEPLOY.md "Backups"): off until deploy/.env sets
  # COMPOSE_PROFILES=backup (sidecar + scheduler) or backup-host-cron (sidecar only; host cron triggers it).
  # Neither has a watchtower label: Dependabot proposes their digest bumps, merged by hand.
  backup:                                       # restic; idles, and runs backup/restic-job.sh steps via docker exec
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    profiles: [backup, backup-host-cron]
    entrypoint: ["/bin/sh", "/backup/restic-job.sh"]
    command: ["idle"]                           # `docker compose run --rm backup restore ...` replaces it
    environment:
      TZ: ${TZ:-UTC}
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RESTIC_CACHE_DIR: /cache
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/backup_offsite_credentials   # S3 API keys (B2 or AWS), INI format
      NOTES_BACKUP_OFFSITE_REPO: ${NOTES_BACKUP_OFFSITE_REPO:-}             # empty = local repository only
    volumes:
      - notes-data:/source/notes-data:ro        # vault + .git; read-only: a restore goes to a scratch directory
      - tailscale-state:/source/tailscale-state:ro
      - type: bind                              # the local repository, on a second disk
        source: ${NOTES_BACKUP_LOCAL_REPO:-/mnt/backup/notes-restic}
        target: /repo
        bind:
          create_host_path: false               # an unmounted disk fails loudly instead of filling the system disk
      - ./backup:/backup:ro
      - backup-cache:/cache
    secrets: [restic_password, backup_offsite_credentials]
    mem_limit: 1g
    logging: *logging
    restart: unless-stopped

  backup-scheduler:                             # runs backup/nightly.sh daily: stops notes around the snapshot
    image: docker:29.8.2-cli@sha256:35cfcf893c20f2931f4909151b5407aaaeab711277de7ce8b8f521f095d54c32   # pinned by digest (it holds docker.sock)
    profiles: [backup]
    depends_on: [backup]
    entrypoint: ["/bin/sh", "/backup/scheduler.sh"]
    environment:
      TZ: ${TZ:-UTC}
      NOTES_BACKUP_TIME: ${NOTES_BACKUP_TIME:-04:00}                   # local time; clear of the app's 03:30 git gc
      NOTES_BACKUP_NTFY_URL: ${NOTES_BACKUP_NTFY_URL:-}                # failure alerts and a weekly OK report
      NOTES_BACKUP_HEARTBEAT_URL: ${NOTES_BACKUP_HEARTBEAT_URL:-}      # optional dead man's switch, pinged after each good run
      NOTES_BACKUP_STATE_DIR: /state
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # docker stop/start notes, docker exec into backup
      - ./backup:/backup:ro
      - backup-state:/state                     # status.json, and the marker that brings notes back after a crash
      - type: bind                              # time zones for TZ (the image has none)
        source: /usr/share/zoneinfo
        target: /usr/share/zoneinfo
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 2m                       # time to start notes again if stopped mid-snapshot
    logging: *logging
    restart: unless-stopped

volumes:
  tailscale-state:
    external: true                              # created once (docs/DEPLOY.md); `docker compose down -v` cannot delete it
  notes-data:
    external: true
  backup-cache: {}                              # restic's cache; disposable
  backup-state: {}                              # backup-scheduler writes status.json; notes reads it (ro)
  whisper-models: {}                            # the transcription model (about 0.5 GB for small); re-downloadable

secrets:                                        # files under deploy/secrets/ (gitignored, mode 600); DEPLOY.md "Backups", "Mirror"
  restic_password:
    file: ./secrets/restic-password
  backup_offsite_credentials:
    file: ./secrets/backup-offsite-credentials
  mirror_token:                                 # the mirror's GitHub token, readable by uid 1000 (the app's user)
    file: ${NOTES_MIRROR_TOKEN_SECRET:-./mirror/no-token}   # an empty file in git until the mirror is set up
  anthropic_key:                                # the Anthropic API key for Ask your vault, readable by uid 1000
    file: ${NOTES_AI_KEY_SECRET:-./ai/no-key}   # an empty file in git until a key is set up
