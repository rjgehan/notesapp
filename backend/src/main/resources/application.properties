spring.application.name=notesapp
server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
spring.mvc.async.request-timeout=30m
spring.web.resources.cache.cachecontrol.no-cache=true
spring.servlet.multipart.enabled=false
# No endpoint takes form fields; upload bodies are raw bytes whatever their Content-Type (QueryParametersFilter).
spring.mvc.formcontent.filter.enabled=false
server.tomcat.max-swallow-size=110MB
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,application/problem+json,text/markdown,text/plain,image/svg+xml,application/wasm
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.add-additional-paths=true
management.health.diskspace.path=${notes.vault-dir}
management.health.diskspace.threshold=1GB
logging.level.org.eclipse.jgit=INFO
logging.pattern.level=%5p [%X{client:-}/%X{request:-}]
notes.vault-dir=/data/vault
