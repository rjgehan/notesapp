# Weekly and grouped, so it produces about one PR per ecosystem per week.
# Major versions arrive as their own PRs (npm, maven) or are ignored where the design pins a
# major line (Node 24, Java 21), so one incompatible major never blocks the routine updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ['*'] } }

  - package-ecosystem: docker              # Dockerfile base images
    directory: /
    schedule: { interval: weekly }
    groups: { docker: { patterns: ['*'] } }
    ignore:
      - dependency-name: node              # Node 24 here and in ci.yml; move both together, by hand
        update-types: ['version-update:semver-major']
      - dependency-name: eclipse-temurin   # Java 21 is the baseline (--release 21)
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose      # watchtower image (tag + digest pin); tailscale follows :stable
    directory: /deploy
    schedule: { interval: weekly }
    groups: { compose: { patterns: ['*'] } }

  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      maven:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript        # pinned ~6.0.x until typescript-eslint supports newer (DESIGN §6.1)
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
