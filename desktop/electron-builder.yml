# Packaging (ROADMAP item 41, docs/DESKTOP.md): a Windows NSIS installer and an unsigned macOS dmg.
# The UI comes from the server, so the package holds only the shell in src/.
appId: com.rjgehan.notesapp.desktop
productName: NotesApp
copyright: Copyright © rjgehan. GPL-3.0-only.
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
  - "!**/*.test.js"
asar: true
electronLanguages: [en-US]

win:
  target: [nsis]
  icon: build/icon.png
  artifactName: NotesApp-Setup-${version}.${ext}
  # Not code-signed: Windows SmartScreen asks once ("More info" › "Run anyway").
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NotesApp
  # Keeps the window state and server setting when the app is removed and reinstalled.
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: NotesApp-${version}-mac.${ext}
  # Unsigned and not notarised: ad-hoc signed only, so Apple Silicon runs it. Gatekeeper steps in docs/DESKTOP.md.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  title: NotesApp ${version}
