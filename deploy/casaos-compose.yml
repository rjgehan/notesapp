# NotesApp for CasaOS (simple): the app + Watchtower. Uses the Tailscale already running on the host.
# (deploy/casaos-compose-sidecar.yml is the older own-Tailscale-container variant; CasaOS rejects its shared network.)
#
# Before installing, once over SSH on the server:
#   sudo mkdir -p /DATA/AppData/notesapp/data && sudo chown -R 1000:1000 /DATA/AppData/notesapp/data
# After installing, once (gives HTTPS on your tailnet; survives reboots):
#   sudo tailscale serve --bg --https=443 http://127.0.0.1:8095
# Then open https://homeserver.<tailnet>.ts.net
#
# The app listens only on the server's loopback (127.0.0.1:8095), so nothing on the LAN or internet can reach it;
# tailscale serve is the only way in, and it passes your Tailscale login to the app.
name: notesapp

services:
  notes:
    image: ghcr.io/rjgehan/notesapp:latest
    container_name: notesapp
    ports:
      - "127.0.0.1:8095:8080"
    environment:
      TZ: America/New_York
      SERVER_ADDRESS: 0.0.0.0
      NOTES_ALLOWED_HOSTS: homeserver.<tailnet>.ts.net
      NOTES_IDENTITY_ALLOWED_LOGINS: you@example.com   # your Tailscale login; comma-separate several
      NOTES_SECURITY_REQUIRE_TAILSCALE_INTERFACE: "false"
      NOTES_TAILSCALE_WATCHDOG_ENABLED: "false"
    volumes:
      - /DATA/AppData/notesapp/data:/data
    mem_limit: 1g
    stop_grace_period: 45s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:1.23.1
    container_name: notesapp-watchtower
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      TZ: America/New_York
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

x-casaos:
  architectures:
    - amd64
    - arm64
  main: notes
  title:
    en_us: NotesApp
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/obsidian.png
